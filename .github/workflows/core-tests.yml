name: Çekirdek testleri
on:
  push:
    paths: ["ios/Core/**", ".github/workflows/core-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    defaults: { run: { working-directory: ios/Core } }
    steps:
      - uses: actions/checkout@v4
      - name: Xcode sürümü
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)" && swift --version
      - name: Testler
        run: swift test 2>&1 | tee test.log; grep -q "Executed .* tests, with 0 failures" test.log
