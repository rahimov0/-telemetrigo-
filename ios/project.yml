name: TelemetriGo
options:
  bundleIdPrefix: tr.rahimov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Automatic
packages:
  KrovaCore:
    path: Core
targets:
  TelemetriGo:
    type: application
    platform: iOS
    dependencies:
      - package: KrovaCore
    sources:
      - path: App
      - path: Resources
    entitlements:
      path: App/TelemetriGo.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TelemetriGo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [location, bluetooth-central, audio]
        NSLocationWhenInUseUsageDescription: "Sürüş, yürüyüş, koşu ve bisiklet sırasında hızını ve rotanı kaydetmek için konumun kullanılır. Kayıt sırasında ekran kilitliyken de devam eder."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Ekran kilitliyken de sürüş kaydının kesilmemesi için konumun kullanılır."
        NSBluetoothAlwaysUsageDescription: "GoPro kameraya bağlanmak, kaydı başlatıp durdurmak ve saatini eşitlemek için Bluetooth kullanılır."
        NSCameraUsageDescription: "Aktivitene eklemek üzere fotoğraf çekmek için kamera kullanılır."
        NSPhotoLibraryUsageDescription: "Rotayı ve değerleri üstüne ekleyeceğin fotoğrafı seçmek için kullanılır."
        NSPhotoLibraryAddUsageDescription: "Göstergeli videoyu Fotoğraflar'a kaydetmek için kullanılır."
        NSHealthShareUsageDescription: "Günlük adımlarını ve yürüyüşlerini göstermek için Sağlık verilerin okunur."
        NSHealthUpdateUsageDescription: "Bitirdiğin yürüyüş, koşu ve bisiklet aktiviteleri Sağlık uygulamasına antrenman olarak kaydedilir."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.rahimov.telemetrigo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
